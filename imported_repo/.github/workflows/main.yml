name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          node --version
          npm --version
          java -version
          adb version
          sdkmanager --version

      - name: Configure npm
        run: |
          npm config set legacy-peer-deps true
          printf 'legacy-peer-deps=true\n' > .npmrc

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --no-install \
            --non-interactive

      - name: Configure Android SDK path
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Check Gradle
        working-directory: android
        run: ./gradlew --version

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK ==="
          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            -exec ls -lh {} \;

      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" | head -n 1)

          test -n "$APK"

          cp "$APK" release/CPAAutomator-release.apk

          ls -lh release/CPAAutomator-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPAAutomator-APK
          path: release/CPAAutomator-release.apk
          if-no-files-found: error
          retention-days: 30
